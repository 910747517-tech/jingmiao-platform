ion:absolute;left:-28px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--wash)}.visithead{display:flex;gap:10px;align-items:center;margin-bottom:8px}.visithead b{font-size:16px}.visithead time{margin-left:auto;color:var(--muted);font-size:12px}.record-note{color:var(--muted);font-size:12px;margin-bottom:10px}.section-jump{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}.section-jump button{flex:none;border:1px solid var(--line);background:#fff;color:#5d4a40;border-radius:9px;padding:7px 10px;font-size:12px}.section-jump button:hover,.section-jump button:focus-visible{border-color:var(--brand);color:var(--brand);outline:none}.answer-section{margin-top:18px;scroll-margin-top:58px}.answer-section h4{margin:0;padding:9px 12px;background:#f5f0e9;border-radius:9px 9px 0 0;font-size:14px;color:#5d4a40}.answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-top:0}.answer-item{display:grid;grid-template-columns:minmax(112px,34%) minmax(0,1fr);min-width:0;border-bottom:1px solid var(--line)}.answer-item:nth-child(odd){border-right:1px solid var(--line)}.answer-item:nth-last-child(-n+2){border-bottom:0}.answer-question,.answer-value{padding:9px 11px;overflow-wrap:anywhere}.answer-question{background:#fcfaf7;color:#6f665f;font-size:12px}.answer-value{color:var(--ink);white-space:pre-wrap}.answer-value.blank{color:#aaa;font-style:italic}.photo-title{font-weight:700;margin:18px 0 9px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.photo-slot{min-height:150px;border:1px solid var(--line);border-radius:10px;background:#faf8f5;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;font-size:12px;overflow:hidden}.photo-slot img{width:100%;height:210px;object-fit:contain;background:#f5f2ee}.photo-slot span{padding:7px}.legacy{margin-top:14px}.danger{border:0;background:transparent;color:var(--d <body>
<header class="topbar"><div class="topin">
  <img id="hlogo" class="logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="门店 Logo"><div><div class="brand" id="hname">京淼客户档案</div><div class="sub">面诊记录中心</div></div><span class="spacer"></span>
  <a class="toplink" id="newConsult" href="index.html">＋ 新建面诊</a><button class="ghost logout" id="logoutBtn" onclick="logout()">退出</button>
</div></header>
<main>
  <div class="intro"><div><h1>客户面诊档案</h1><p>按姓名、手机号或皮肤问题，找到客户每一次面诊记录。</p></div></div>
  <section class="stats"><div class="stat"><span>客户总数</span><b id="customerCount">0</b></div><div class="stat"><span>面诊记录</span><b id="recordCount">0</b></div><div class="stat"><span>本月新增</span><b id="monthCount">0</b></div></section>
  <section class="panel">
    <div class="filters">
      <input class="control search" id="search" type="search" placeholder="搜索姓名、手机号、问题或规划师">
      <select class="control" id="planner"><option value="">全部规划师</option></select>
      <select class="control" id="period"><option value="">全部时间</option><option value="30">近30天</option><option value="90">近90天</option><option value="365">近一年</option></select>
      <button class="ghost" onclick="exportJSON()">导出数据</button>
    </div>
    <div class="panelhead"><h2>客户列表</h2><span class="result" id="result"></span><span class="status" id="syncStatus">正在读取云端…</span></div>
    <div class="tablewrap"><table><thead><tr><th>客户</th><th>最近关注问题</th><th>皮肤规划师</th><th>最近面诊</th><th>累计面诊</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="cards" id="cards"></div><div class="empty" id="empty"><b>还没有找到客户</b><span>请换一个关键词或时间范围</span></div>
  </section>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><article class="sheet"><header class="sheethead"><div><h2 id="mTitle">客户档案</h2><div class="sub" id="mSub"></div></div><button class="close" onclick="closeModal()" aria-label="关闭">×</button></header><div class="scroll-progress" aria-hidden="true"><i id="scrollProgress"></i></div><div class="sheetbody" id="mBody" onscroll="updateArchiveProgress()"></div></article></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>

    try{
      const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}
      const {data:su}=await sb.from('store_users').select('role,tenant_id').eq('id',session.user.id).single();if(!su){await sb.auth.signOut();location.href='login.html';return}if(su.role==='platform'){location.href='admin.html';return}
      myTenantId=su.tenant_id;const {data:t,error:te}=await sb.from('tenants').select('*').eq('id',myTenantId).single();if(te)throw te;tenant=t;renderBrand();await loadRecords();
    }catch(e){setStatus('云端暂时无法连接',true);showEmpty('云端连接失败','请检查网络或云端服务后刷新');toast('读取失败：'+(e.message||e));}
  }
  function renderBrand(){document.documentElement.style.setProperty('--brand',tenant.primary_color||'#9d4d3f');document.getElementById('hname').textContent=(tenant.brand_name||'门店')+' · 客户档案';document.getElementById('newConsult').href='index.html?store='+encodeURIComponent(tenant.slug||'demo');if(tenant.logo_url){const x=document.getElementById('hlogo');x.src=tenant.logo_url;x.style.display='block'}}
  async function loadRecords(){let all=[];for(let from=0;from<5000;from+=500){const {data,error}=await sb.from('submissions').select('*').eq('tenant_id',myTenantId).order('created_at',{ascending:false}).range(from,from+499);if(error)throw error;all.push(...data);if(data.length<500)break}records=all;prepare();setStatus('云端已同步',false)}
  function prepare(){
    const map=new Map();records.forEach(r=>{const key=customerKey(r);if(!map.has(key))map.set(key,{key,name:getName(r),phone:getPhone(r),birth:r.data?.birth||'',visits:[]});map.get(key).visits.push(r)});customers=[...map.values()].map(c=>({...c,visits:c.visits.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),latest:c.visits[0]})).sort((a,b)=>new Date(b.latest.created_at)-new Date(a.latest.created_at));
    const planners=[...new Set(records.map(r=>r.data?.consultant).filter(Boolean))].sort();document.getElementById('planner').innerHTML='<option value="">全部规划师</option>'+planners.map(x=>`<option>${esc(x)}</option>`).join('');
    document.getElementById('customerCount').textContent=customers.length;document.getElementById('recordCount').textContent=records.length;const now=new Date();document.getElementById('monthCount').textContent=records.filter(r=>{const d=new Date(r.created_at);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}).length;render();
  }
  function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),p=document.getElementById('planner').value,days=+document.getElementById('period').value,cut=days?Date.now()-days*864e5:0;return customers.filter(c=>{const d=c.latest.data||{};const hay=[c.name,c.phone,d.consultant,getConcern(d),d.q_bother,d.q_expect].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!p||c.visits.some(v=>v.data?.consultant===p))&&(!cut||new Date(c.latest.created_at).getTime()>=cut)})}
  function render(){const list=filtered(),tb=document.getElementById('tbody'),cards=document.getElementById('cards');document.getElementById('result').textContent='共 '+list.length+' 位';document.getElementById('empty').style.display=list.length?'none':'block';tb.innerHTML=list.map(c=>row(c)).join('');cards.innerHTML=list.map(c=>card(c)).join('')}
  function row(c){const d=c.latest.data||{},key=encodeURIComponent(c.key);return `<tr><td><div class="name">${esc(c.name)}</div><div class="phone">${esc(c.phone||'未留手机号')}</div></td><td><span class="issue">${esc(getConcern(d))}</span></td><td>${esc(d.consultant||'—')}</td><td>${fmt(c.latest.created_at)}</td><td><span class="count">${c.visits.length}</span> 次</td><td><button class="action" onclick="openCustomer('${key}')">查看档案 →</button></td></tr>`}
  function card(c){const d=c.latest.data||{},key=encodeURIComponent(c.key);return `<article class="customer"><div><div class="name">${esc(c.name)}</div><div class="phone">${esc(c.phone||'未留手机号')}</div></div><button class="action" onclick="openCustomer('${key}')">查看 →</button><div class="details"><span class="issue">${esc(getConcern(d))}</span><span class="meta">${fmt(c.latest.created_at)} · ${c.visits.length}次</span></div></article>`}
  function openCustomer(encodedKey){const key=decodeURIComponent(encodedKey),c=customers.find(x=>x.key===key);if(!c)return;const latest=c.latest.data||{},fieldCount=FORM_SECTIONS.reduce((sum,section)=>sum+section.fields.length,0);document.getElementById('mTitle').textContent=c.name;document.getElementById('mSub').textContent=(c.phone||'未留手机号')+' · 共 '+c.visits.length+' 次面诊';let html=`<div class="archive-guide"><b>完整档案：每次 ${fieldCount} 项，共 ${FORM_SECTIONS.length} 个分区</b><span>请在这个窗口内向下滚动，查看全部答案和历史面诊。</span></div><section class="profile"><div><span>出生/年龄</span><b>${esc(c.birth||latest.age||'—')}</b></div><div><span>最近诉求</span><b>${esc(getConcern(latest))}</b></div><div><span>负责规划师</span><b>${esc(latest.consultant||'—')}</b></div><div><span>最近面诊</span><b>${fmt(c.latest.created_at)}</b></div></section><div class="timeline">`;
    html+=c.visits.map((r,i)=>visit(r,i,c.visits.length)).join('')+'</div>';const body=document.getElementById('mBody');body.innerHTML=html;body.scrollTop=0;document.getElementById('modal').classList.add('show');document.body.style.overflow='hidden';requestAnimationFrame(updateArchiveProgress)}
  function hasAnswer(v){return Array.isArray(v)?v.length>0:v!==undefined&&v!==null&&String(v).trim()!==''}
  function answerItem(d,field){const [key,label]=field,filled=hasAnswer(d[key]);return `<div class="answer-item"><div class="answer-question">${esc(label)}</div><div class="answer-value${filled?'':' blank'}">${filled?esc(value(d[key])):'未填写'}</div></div>`}
  function answerSection(d,section,id){return `<section class="answer-section" id="${id}"><h4>${esc(section.title)}</h4><div class="answer-grid">${section.fields.map(field=>answerItem(d,field)).join('')}</div></section>`}
  function photoSection(d){const slots=[['front','正面照'],['left','左侧面照'],['right','右侧面照']];return `<div class="photo-title">面部三面照</div><div class="photos">${slots.map(([key,label])=>{const src=d['face_'+key];return `<div class="photo-slot">${src?`<img src="${esc(src)}" alt="${esc(label)}">`:'<span>未上传</span>'}<span>${esc(label)}</span></div>`}).join('')}</div>`}
  function legacySection(d){const hidden=new Set(['face_front','face_left','face_right']);const fields=Object.keys(d).filter(key=>!KNOWN_FIELDS.has(key)&&!hidden.has(key)&&hasAnswer(d[key])).map(key=>[key,key]);return fields.length?`<section class="answer-section legacy"><h4>历史版本补充记录</h4><div class="answer-grid">${fields.map(field=>answerItem(d,field)).join('')}</div></section>`:''}
  function visit(r,i,total){const d=r.data||{},prefix=`visit-${i}`;const sections=FORM_SECTIONS.map((section,j)=>answerSection(d,section,`${prefix}-section-${j}`)).join('');const jump=FORM_SECTIONS.map((section,j)=>`<button type="button" onclick="scrollToAnswer('${prefix}-section-${j}')">${esc(section.title.replace(/^[一二三四五]、/,'').replace('与面部分布','').replace('与分阶段规划','').replace('、复盘与调整',''))}</button>`).join('');return `<article class="visit"><div class="visithead"><b>${i===0?'最近一次面诊':'历史面诊 '+(total-i)}</b><time>${fmtLong(r.created_at)}</time></div><div class="record-note">以下为该次面诊的完整答案表，未填写的项目也会保留显示。</div><nav class="section-jump" aria-label="面诊表分区快捷入口">${jump}</nav>${sections}${photoSection(d)}${legacySection(d)}<button class="danger" onclick="deleteRecord('${esc(r.id)}')">删除这次记录</button></article>`}
  async function deleteRecord(id){if(!confirm('确定删除这一次面诊记录？删除后无法恢复。'))return;if(demoMode){records=records.filter(r=>r.id!==id);localStorage.setItem('facesheet_submissions_demo',JSON.stringify(records));closeModal();prepare();toast('记录已删除');return}const {error}=await sb.from('submissions').delete().eq('id',id).eq('tenant_id',myTenantId);if(error){toast('删除失败：'+error.message);return}closeModal();await loadRecords();toast('记录已删除')}
  function exportJSON(){if(!records.length){toast('暂无数据可导出');return}const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(tenant?.brand_name||'门店')+'_客户面诊档案_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function scrollToAnswer(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}function updateArchiveProgress(){const body=document.getElementById('mBody'),max=body.scrollHeight-body.clientHeight,pct=max>0?Math.min(1,body.scrollTop/max):1;document.getElementById('scrollProgress').style.transform=`scaleX(${pct})`}function closeModal(){document.getElementById('modal').classList.remove('show');document.body.style.overflow=''}function fmt(x){return new Date(x).toLocaleDateString('zh-CN')}function fmtLong(x){return new Date(x).toLocaleString('zh-CN',{hour12:false})}function setStatus(t,b){const x=document.getElementById('syncStatus');x.textContent=t;x.classList.toggle('bad',!!b)}function showEmpty(a,b){const x=document.getElementById('empty');x.style.display='block';x.innerHTML='<b>'+esc(a)+'</b><span>'+esc(b)+'</span>'}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}async function logout(){await sb.auth.signOut();location.href='login.html'}
  ['search','planner','period'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});boot();
</script>
</body>
</html>
