<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>客户面诊档案 · 京淼</title>
<style>
  :root{--brand:#9d4d3f;--ink:#282522;--muted:#817973;--line:#e8e0d8;--paper:#fffdf9;--wash:#f5f0e9;--green:#567462;--danger:#a84646}
  *{box-sizing:border-box} body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}
  button,input,select{font:inherit} button{cursor:pointer} .topbar{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
  .topin{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:11px;object-fit:cover;background:#eee;display:none}
  .brand{font-weight:700;font-size:16px}.sub{font-size:12px;color:var(--muted)}.spacer{flex:1}.toplink,.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:9px;text-decoration:none}.primary{border:0;background:var(--brand);color:#fff;padding:9px 15px;border-radius:9px;font-weight:650}
  main{max-width:1180px;margin:24px auto 70px;padding:0 20px}.intro{display:flex;gap:20px;align-items:end;margin-bottom:18px}.intro h1{font-size:26px;margin:0 0 3px;letter-spacing:-.02em}.intro p{margin:0;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 26px rgba(76,55,38,.035)}.stat{padding:16px 18px}.stat b{display:block;font:700 24px/1.2 Georgia,serif;margin-top:4px}.stat span{color:var(--muted);font-size:12px}
  .panel{padding:18px}.filters{display:grid;grid-template-columns:minmax(260px,2fr) 1fr 1fr auto;gap:10px}.control{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;outline:none;width:100%}.control:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
  .panelhead{display:flex;align-items:center;gap:12px;margin:20px 0 10px}.panelhead h2{margin:0;font-size:17px}.result{color:var(--muted);font-size:12px}.status{margin-left:auto;color:var(--green);font-size:12px}.status.bad{color:var(--danger)}
  table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid #eee8e1;vertical-align:top}tbody tr:hover{background:#fbf7f1}.name{font-weight:700;font-size:15px}.phone,.meta{color:var(--muted);font-size:12px}.issue{display:inline-block;background:#f5ebe7;color:#7c3f35;border-radius:20px;padding:3px 9px}.count{font-weight:700;color:var(--brand)}.action{border:0;background:transparent;color:var(--brand);padding:4px 0;font-weight:650}
  .cards{display:none}.empty{text-align:center;color:var(--muted);padding:56px 12px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(32,28,25,.56);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}.modal.show{display:flex}.sheet{width:min(860px,100%);background:var(--paper);border-radius:18px;box-shadow:0 26px 70px rgba(0,0,0,.22);overflow:hidden}.sheethead{position:sticky;top:0;z-index:2;padding:18px 22px;background:rgba(255,253,249,.96);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.sheethead h2{margin:0;font-size:20px}.close{margin-left:auto;border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;font-size:20px}.sheetbody{padding:22px}.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.profile div{background:#f8f4ef;border-radius:10px;padding:10px}.profile span{display:block;color:var(--muted);font-size:11px}.profile b{font-size:13px}.timeline{border-left:1px solid var(--line);margin-left:8px;padding-left:22px}.visit{position:relative;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.visit:before{content:"";position:absolute;left:-28px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--wash)}.visithead{display:flex;gap:10px;align-items:center;margin-bottom:12px}.visithead b{font-size:15px}.visithead time{margin-left:auto;color:var(--muted);font-size:12px}.kv{display:grid;grid-template-columns:112px 1fr;gap:7px 12px}.kv .k{color:var(--muted)}.photos{display:flex;gap:8px;overflow:auto;margin-top:12px}.photos img{height:110px;width:88px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}.danger{border:0;background:transparent;color:var(--danger);font-size:12px;margin-top:12px;padding:0}.toast{position:fixed;bottom:24px;left:50%;z-index:100;transform:translate(-50%,15px);opacity:0;background:#272320;color:#fff;padding:10px 17px;border-radius:10px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:760px){.topin{padding:11px 14px}.toplink{display:none}main{margin-top:18px;padding:0 12px}.intro{align-items:flex-start}.intro h1{font-size:22px}.stats{gap:7px}.stat{padding:12px}.stat b{font-size:20px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.tablewrap{display:none}.cards{display:grid;gap:9px}.customer{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:8px}.customer .details{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}.panel{padding:13px}.profile{grid-template-columns:1fr 1fr}.modal{padding:0;align-items:stretch}.sheet{min-height:100%;border-radius:0}.sheethead{padding:14px}.sheetbody{padding:14px}.timeline{padding-left:16px}.visit:before{left:-22px}.kv{grid-template-columns:86px 1fr}.visithead{align-items:flex-start;flex-wrap:wrap}.visithead time{width:100%;margin:0}.logout{padding:7px 10px}}
</style>
</head>
<body>
<header class="topbar"><div class="topin">
  <img id="hlogo" class="logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="门店 Logo"><div><div class="brand" id="hname">京淼客户档案</div><div class="sub">面诊记录中心</div></div><span class="spacer"></span>
  <a class="toplink" id="newConsult" href="index.html">＋ 新建面诊</a><button class="ghost logout" id="logoutBtn" onclick="logout()">退出</button>
</div></header>
<main>
  <div class="intro"><div><h1>客户面诊档案</h1><p>按姓名、手机号或皮肤问题，找到客户每一次面诊记录。</p></div></div>
  <section class="stats"><div class="stat"><span>客户总数</span><b id="customerCount">0</b></div><div class="stat"><span>面诊记录</span><b id="recordCount">0</b></div><div class="stat"><span>本月新增</span><b id="monthCount">0</b></div></section>
  <section class="panel">
    <div class="filters">
      <input class="control search" id="search" type="search" placeholder="搜索姓名、手机号、问题或规划师">
      <select class="control" id="planner"><option value="">全部规划师</option></select>
      <select class="control" id="period"><option value="">全部时间</option><option value="30">近30天</option><option value="90">近90天</option><option value="365">近一年</option></select>
      <button class="ghost" onclick="exportJSON()">导出数据</button>
    </div>
    <div class="panelhead"><h2>客户列表</h2><span class="result" id="result"></span><span class="status" id="syncStatus">正在读取云端…</span></div>
    <div class="tablewrap"><table><thead><tr><th>客户</th><th>最近关注问题</th><th>皮肤规划师</th><th>最近面诊</th><th>累计面诊</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="cards" id="cards"></div><div class="empty" id="empty"><b>还没有找到客户</b><span>请换一个关键词或时间范围</span></div>
  </section>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><article class="sheet"><header class="sheethead"><div><h2 id="mTitle">客户档案</h2><div class="sub" id="mSub"></div></div><button class="close" onclick="closeModal()" aria-label="关闭">×</button></header><div class="sheetbody" id="mBody"></div></article></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>
  let tenant=null,myTenantId=null,customers=[],records=[];
  const demoMode=new URLSearchParams(location.search).get('demo')==='1';
  const LABELS={name:'顾客姓名',phone:'手机号',birth:'出生日期',age:'年龄',firstDate:'面诊日期',booking:'每月可到店次数',consultant:'皮肤规划师',primary_concern:'首要诉求',concern:'关注问题',q_concern:'最在意的问题',q_start:'开始时间',q_repeat:'是否反复',q_bother:'造成的困扰',q_expect:'期待效果',skin_type:'皮肤类型',m_surface:'表层现象',m_deep:'深层原因',m_loop:'问题循环',avoid:'避坑建议',diagnosis:'专业判断',plan:'护理方向',homecare:'居家建议'};
  const DISPLAY=['primary_concern','concern','q_concern','q_start','q_repeat','q_bother','q_expect','skin_type','m_surface','m_deep','diagnosis','plan','homecare','avoid'];
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const value=v=>Array.isArray(v)?v.join('、'):v;
  const getName=r=>r.customer_name||r.data?.name||'未填写姓名';
  const getPhone=r=>String(r.data?.phone||r.phone||'').trim();
  const getConcern=d=>value(d.primary_concern||d.concern||d.q_concern||'待补充');
  function customerKey(r){const p=getPhone(r).replace(/\D/g,'');if(p)return 'p:'+p;const d=r.data||{};return 'n:'+getName(r)+'|'+(d.birth||d.age||'');}
  async function boot(){
    if(demoMode){tenant={brand_name:'京淼演示门店',slug:'demo',primary_color:'#9d4d3f'};records=JSON.parse(localStorage.getItem('facesheet_submissions_demo')||'[]').map((item,i)=>item&&item.data?item:{id:'demo-'+i,created_at:item?._submittedAt||new Date().toISOString(),customer_name:item?.name||'',data:item||{}});document.getElementById('logoutBtn').style.display='none';renderBrand();prepare();setStatus('本机演示数据',false);return;}
    try{
      const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}
      const {data:su}=await sb.from('store_users').select('role,tenant_id').eq('id',session.user.id).single();if(!su){await sb.auth.signOut();location.href='login.html';return}if(su.role==='platform'){location.href='admin.html';return}
      myTenantId=su.tenant_id;const {data:t,error:te}=await sb.from('tenants').select('*').eq('id',myTenantId).single();if(te)throw te;tenant=t;renderBrand();await loadRecords();
    }catch(e){setStatus('云端暂时无法连接',true);showEmpty('云端连接失败','请检查网络或云端服务后刷新');toast('读取失败：'+(e.message||e));}
  }
  function renderBrand(){document.documentElement.style.setProperty('--brand',tenant.primary_color||'#9d4d3f');document.getElementById('hname').textContent=(tenant.brand_name||'门店')+' · 客户档案';document.getElementById('newConsult').href='index.html?store='+encodeURIComponent(tenant.slug||'demo');if(tenant.logo_url){const x=document.getElementById('hlogo');x.src=tenant.logo_url;x.style.display='block'}}
  async function loadRecords(){let all=[];for(let from=0;from<5000;from+=500){const {data,error}=await sb.from('submissions').select('*').eq('tenant_id',myTenantId).order('created_at',{ascending:false}).range(from,from+499);if(error)throw error;all.push(...data);if(data.length<500)break}records=all;prepare();setStatus('云端已同步',false)}
  function prepare(){
    const map=new Map();records.forEach(r=>{const key=customerKey(r);if(!map.has(key))map.set(key,{key,name:getName(r),phone:getPhone(r),birth:r.data?.birth||'',visits:[]});map.get(key).visits.push(r)});customers=[...map.values()].map(c=>({...c,visits:c.visits.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),latest:c.visits[0]})).sort((a,b)=>new Date(b.latest.created_at)-new Date(a.latest.created_at));
    const planners=[...new Set(records.map(r=>r.data?.consultant).filter(Boolean))].sort();document.getElementById('planner').innerHTML='<option value="">全部规划师</option>'+planners.map(x=>`<option>${esc(x)}</option>`).join('');
    document.getElementById('customerCount').textContent=customers.length;document.getElementById('recordCount').textContent=records.length;const now=new Date();document.getElementById('monthCount').textContent=records.filter(r=>{const d=new Date(r.created_at);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}).length;render();
  }
  function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),p=document.getElementById('planner').value,days=+document.getElementById('period').value,cut=days?Date.now()-days*864e5:0;return customers.filter(c=>{const d=c.latest.data||{};const hay=[c.name,c.phone,d.consultant,getConcern(d),d.q_bother,d.q_expect].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!p||c.visits.some(v=>v.data?.consultant===p))&&(!cut||new Date(c.latest.created_at).getTime()>=cut)})}
  function render(){const list=filtered(),tb=document.getElementById('tbody'),cards=document.getElementById('cards');document.getElementById('result').textContent='共 '+list.length+' 位';document.getElementById('empty').style.display=list.length?'none':'block';tb.innerHTML=list.map(c=>row(c)).join('');cards.innerHTML=list.map(c=>card(c)).join('')}
  function row(c){const d=c.latest.data||{},key=encodeURIComponent(c.key);return `<tr><td><div class="name">${esc(c.name)}</div><div class="phone">${esc(c.phone||'未留手机号')}</div></td><td><span class="issue">${esc(getConcern(d))}</span></td><td>${esc(d.consultant||'—')}</td><td>${fmt(c.latest.created_at)}</td><td><span class="count">${c.visits.length}</span> 次</td><td><button class="action" onclick="openCustomer('${key}')">查看档案 →</button></td></tr>`}
  function card(c){const d=c.latest.data||{},key=encodeURIComponent(c.key);return `<article class="customer"><div><div class="name">${esc(c.name)}</div><div class="phone">${esc(c.phone||'未留手机号')}</div></div><button class="action" onclick="openCustomer('${key}')">查看 →</button><div class="details"><span class="issue">${esc(getConcern(d))}</span><span class="meta">${fmt(c.latest.created_at)} · ${c.visits.length}次</span></div></article>`}
  function openCustomer(encodedKey){const key=decodeURIComponent(encodedKey),c=customers.find(x=>x.key===key);if(!c)return;const latest=c.latest.data||{};document.getElementById('mTitle').textContent=c.name;document.getElementById('mSub').textContent=(c.phone||'未留手机号')+' · 共 '+c.visits.length+' 次面诊';let html=`<section class="profile"><div><span>出生/年龄</span><b>${esc(c.birth||latest.age||'—')}</b></div><div><span>最近诉求</span><b>${esc(getConcern(latest))}</b></div><div><span>负责规划师</span><b>${esc(latest.consultant||'—')}</b></div><div><span>最近面诊</span><b>${fmt(c.latest.created_at)}</b></div></section><div class="timeline">`;
    html+=c.visits.map((r,i)=>visit(r,i,c.visits.length)).join('')+'</div>';document.getElementById('mBody').innerHTML=html;document.getElementById('modal').classList.add('show');document.body.style.overflow='hidden'}
  function visit(r,i,total){const d=r.data||{};let kv=DISPLAY.filter(k=>value(d[k])).map(k=>`<div class="k">${esc(LABELS[k]||k)}</div><div>${esc(value(d[k]))}</div>`).join('');const photos=['front','left','right'].map(k=>d['face_'+k]).filter(Boolean);return `<article class="visit"><div class="visithead"><b>${i===0?'最近一次面诊':'历史面诊 '+(total-i)}</b><time>${fmtLong(r.created_at)}</time></div><div class="kv">${kv||'<div class="k">记录内容</div><div>暂无结构化内容</div>'}</div>${photos.length?'<div class="photos">'+photos.map(x=>`<img src="${esc(x)}" alt="面部照片">`).join('')+'</div>':''}<button class="danger" onclick="deleteRecord('${esc(r.id)}')">删除这次记录</button></article>`}
  async function deleteRecord(id){if(!confirm('确定删除这一次面诊记录？删除后无法恢复。'))return;if(demoMode){records=records.filter(r=>r.id!==id);localStorage.setItem('facesheet_submissions_demo',JSON.stringify(records));closeModal();prepare();toast('记录已删除');return}const {error}=await sb.from('submissions').delete().eq('id',id).eq('tenant_id',myTenantId);if(error){toast('删除失败：'+error.message);return}closeModal();await loadRecords();toast('记录已删除')}
  function exportJSON(){if(!records.length){toast('暂无数据可导出');return}const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(tenant?.brand_name||'门店')+'_客户面诊档案_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function closeModal(){document.getElementById('modal').classList.remove('show');document.body.style.overflow=''}function fmt(x){return new Date(x).toLocaleDateString('zh-CN')}function fmtLong(x){return new Date(x).toLocaleString('zh-CN',{hour12:false})}function setStatus(t,b){const x=document.getElementById('syncStatus');x.textContent=t;x.classList.toggle('bad',!!b)}function showEmpty(a,b){const x=document.getElementById('empty');x.style.display='block';x.innerHTML='<b>'+esc(a)+'</b><span>'+esc(b)+'</span>'}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}async function logout(){await sb.auth.signOut();location.href='login.html'}
  ['search','planner','period'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});boot();
</script>
</body>
</html>
